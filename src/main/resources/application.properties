# ==============================================================================
# Konfigurasi Aplikasi Spring Boot & Camunda BPMN
# Sistem Pengajuan Cuti Mahasiswa
# ==============================================================================

spring.application.name=bpmn-leave-request
server.port=8080

# --- Konfigurasi Database H2 In-Memory ---
spring.datasource.url=jdbc:h2:mem:camunda-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Konfigurasi JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- H2 Console (Web Console untuk memantau data H2) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Camunda BPM Configuration
camunda.bpm.auto-deployment-enabled=true
camunda.bpm.database.schema-update=true
camunda.bpm.job-execution.enabled=true
camunda.bpm.generic-properties.properties.history-time-to-live=180
camunda.bpm.generic-properties.properties.enforce-history-time-to-live=false

# Camunda Webapp Admin Credentials
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.admin-user.first-name=Administrator
camunda.bpm.admin-user.last-name=Camunda
camunda.bpm.admin-user.email=admin@example.com

# Membuat filter default untuk Tasklist
camunda.bpm.filter.create=All Tasks

# Konfigurasi Logging
logging.level.com.example.bpmn=INFO
logging.level.org.camunda.bpm=INFO
